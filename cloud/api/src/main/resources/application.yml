spring:
  application.name: occ-pricer-cloud
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/occ}
    username: ${DATABASE_USER:occ}
    password: ${DATABASE_PASSWORD:occ}
    hikari.maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  flyway.enabled: true
  jackson.serialization.write-dates-as-timestamps: false
  threads.virtual.enabled: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  compression.enabled: true
  compression.mime-types: application/json,text/html,text/css,application/javascript,text/csv
management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
app:
  session-secret: ${APP_SESSION_SECRET}
  secure-cookie: ${APP_SECURE_COOKIE:true}
  # Auth0 Universal Login, in the same tenant as cardbox.club. AUTH0_DOMAIN may be the tenant domain or its custom login domain.
  auth0:
    domain: ${AUTH0_DOMAIN:}
    client-id: ${AUTH0_CLIENT_ID:}
    client-secret: ${AUTH0_CLIENT_SECRET:}
  # Platform owner. Only counts once Auth0 has verified the address.
  owner-email: ${OWNER_EMAIL:toby@vanroojen.com}
  trial-days: 30
  catalog.user-agent: OCCPricerCloud/0.1 (+https://github.com/tvanroo/OCC_PRICER)
